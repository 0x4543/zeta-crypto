[package]
name = "zeta_crypto"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/denagain/zeta-crypto"
homepage = "https://github.com/denagain/zeta-crypto"
readme = "README.md"
description = "Rust-based crypto CLI playground for WalletConnect, mnemonic, and signing experiments."
keywords = ["crypto", "wallet", "cli", "walletconnect", "rust"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]

[dependencies]
bip39 = "1.1"
k256 = { version = "0.13", features = ["ecdsa"] }
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
hex = "0.4"
base64 = "0.21"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
# Используем точную версию, совместимую с alloy 0.9
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
toml = "0.8"
num_cpus = "1.16"
tokio = { version = "1.35", features = ["full"] }
alloy = { version = "0.9", features = ["full"] }

[lib]
name = "zeta_crypto"
path = "src/lib.rs"

[[bin]]
name = "zeta-cli"
path = "src/bin/cli.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"