[package]
name = "zeta_crypto"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/0x4543/zeta-crypto"
homepage = "https://github.com/0x4543/zeta-crypto"
readme = "README.md"
description = "Professional Rust CLI for Base Network: Wallet, Basenames, and Batch Transfers."
keywords = ["crypto", "base", "wallet", "cli", "alloy"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]

[dependencies]
bip39 = "1.1"
k256 = { version = "0.13", features = ["ecdsa"] }
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
hex = "0.4"
base64 = "0.21"
clap = { version = "4.4", features = ["derive", "env"] }
anyhow = "1.0"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
toml = "0.8"
num_cpus = "1.16"
tokio = { version = "1.35", features = ["full"] }
alloy = { version = "0.9", features = ["full"] }
url = "2.5"
reqwest = "0.12"

[lib]
name = "zeta_crypto"
path = "src/lib.rs"

[[bin]]
name = "zeta-cli"
path = "src/bin/cli.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"